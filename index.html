<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Canvas Desk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.0/fabric.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/ag-psd@25/dist/bundle.js"></script>
<style>
  :root{
    --navy-950:#070b14;
    --navy-900:#0c1220;
    --navy-800:#121a2c;
    --navy-700:#1a2540;
    --navy-600:#26355a;
    --navy-500:#3a4d7a;
    --ink-100:#eef1fa;
    --ink-300:#c2c9de;
    --ink-500:#8a93b3;
    --ink-700:#5a6386;
    --gold-400:#f1c977;
    --gold-500:#d9a94a;
    --gold-600:#b5842f;
    --danger:#e0715c;
    --ok:#7fc79b;
    --radius:10px;
    --font-display:'Syne', sans-serif;
    --font-body:'DM Sans', sans-serif;
    --font-mono:'DM Mono', monospace;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(1200px 800px at 15% -10%, #16203a 0%, var(--navy-950) 55%);
    color:var(--ink-100);
    font-family:var(--font-body);
    overflow:hidden;
  }
  ::selection{ background:var(--gold-500); color:var(--navy-950); }

  /* ---------- App shell ---------- */
  #app{
    display:grid;
    grid-template-columns: 240px 1fr 280px;
    grid-template-rows: 56px 1fr;
    grid-template-areas:
      "header header header"
      "layers stage inspector";
    height:100vh;
  }

  /* ---------- Header ---------- */
  header{
    grid-area: header;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 20px;
    background:linear-gradient(180deg, var(--navy-900), var(--navy-950));
    border-bottom:1px solid var(--navy-700);
    z-index:20;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand-mark{
    width:26px; height:26px; border-radius:7px;
    background:linear-gradient(135deg, var(--gold-400), var(--gold-600));
    display:flex; align-items:center; justify-content:center;
    font-family:var(--font-display); font-weight:800; font-size:13px; color:var(--navy-950);
    flex-shrink:0;
  }
  .brand-title{
    font-family:var(--font-display); font-weight:700; font-size:16.5px; letter-spacing:0.2px;
  }
  .brand-title span{ color:var(--gold-400); }
  .toolbar{
    display:flex; align-items:center; gap:6px;
  }
  .tool-btn{
    display:flex; align-items:center; gap:7px;
    background:var(--navy-800); border:1px solid var(--navy-600);
    color:var(--ink-200,var(--ink-100)); font-family:var(--font-body); font-weight:600; font-size:12.5px;
    padding:8px 12px; border-radius:8px; cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .1s ease;
  }
  .tool-btn:hover{ border-color:var(--gold-500); background:var(--navy-700); }
  .tool-btn:active{ transform:translateY(1px); }
  .tool-btn.primary{
    background:linear-gradient(135deg, var(--gold-400), var(--gold-600));
    color:var(--navy-950); border-color:transparent;
  }
  .tool-btn.primary:hover{ filter:brightness(1.06); }
  .tool-sep{ width:1px; height:22px; background:var(--navy-600); margin:0 4px; }
  .icon{ width:14px; height:14px; flex-shrink:0; }

  /* ---------- Layers panel ---------- */
  #layers-panel{
    grid-area: layers;
    background:var(--navy-900);
    border-right:1px solid var(--navy-700);
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  .panel-heading{
    padding:14px 16px 10px;
    font-family:var(--font-display); font-weight:700; font-size:11px;
    letter-spacing:1.4px; text-transform:uppercase; color:var(--ink-500);
    display:flex; align-items:center; justify-content:space-between;
  }
  .panel-heading small{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:0; color:var(--ink-700);
    text-transform:none;
  }
  #layer-list{
    flex:1; overflow-y:auto; padding:4px 8px 12px;
  }
  .layer-row{
    display:flex; align-items:center; gap:8px;
    padding:8px 8px; border-radius:8px; margin-bottom:2px;
    cursor:pointer; border:1px solid transparent;
    user-select:none;
  }
  .layer-row:hover{ background:var(--navy-800); }
  .layer-row.active{ background:var(--navy-700); border-color:var(--gold-500); }
  .layer-row.dragging{ opacity:0.4; }
  .layer-icon{
    width:24px; height:24px; border-radius:6px; flex-shrink:0;
    background:var(--navy-700); display:flex; align-items:center; justify-content:center;
    color:var(--gold-400);
  }
  .layer-name{
    flex:1; font-size:12.5px; font-weight:500; color:var(--ink-100);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .layer-actions{ display:flex; gap:2px; }
  .layer-actions button{
    background:none; border:none; color:var(--ink-500); cursor:pointer;
    width:22px; height:22px; border-radius:5px; display:flex; align-items:center; justify-content:center;
  }
  .layer-actions button:hover{ background:var(--navy-600); color:var(--ink-100); }
  .layer-actions button.off{ color:var(--ink-700); }
  #empty-layers{
    padding:24px 16px; text-align:center; color:var(--ink-700); font-size:12px; line-height:1.6;
  }

  /* ---------- Stage ---------- */
  #stage-wrap{
    grid-area: stage;
    position:relative;
    display:flex; align-items:center; justify-content:center;
    overflow:auto;
    background:
      linear-gradient(var(--navy-800) 1px, transparent 1px) 0 0 / 24px 24px,
      linear-gradient(90deg, var(--navy-800) 1px, transparent 1px) 0 0 / 24px 24px,
      var(--navy-950);
  }
  #canvas-shell{
    position:relative;
    background:transparent;
  }
  #artboard-guide{
    position:absolute;
    background:#fff;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.7), 0 0 0 1px var(--navy-600);
    border-radius:2px;
    pointer-events:none;
    z-index:0;
  }
  #stage-toolbar{
    position:absolute; top:16px; left:50%; transform:translateX(-50%);
    display:flex; align-items:center; gap:6px;
    background:rgba(12,18,32,0.9); backdrop-filter:blur(8px);
    border:1px solid var(--navy-600); border-radius:10px; padding:6px;
    z-index:10;
  }
  #stage-toolbar .tool-btn{ padding:7px 10px; }
  #zoom-readout{
    font-family:var(--font-mono); font-size:11px; color:var(--ink-500); padding:0 6px; min-width:44px; text-align:center;
  }
  #canvas-dims{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    font-family:var(--font-mono); font-size:11px; color:var(--ink-700);
    background:rgba(12,18,32,0.85); padding:5px 12px; border-radius:20px; border:1px solid var(--navy-700);
  }

  /* ---------- Inspector ---------- */
  #inspector{
    grid-area: inspector;
    background:var(--navy-900);
    border-left:1px solid var(--navy-700);
    display:flex; flex-direction:column;
    overflow-y:auto;
  }
  .insp-section{
    padding:14px 16px; border-bottom:1px solid var(--navy-800);
  }
  .insp-section h4{
    margin:0 0 10px; font-family:var(--font-display); font-weight:700; font-size:10.5px;
    letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-500);
  }
  .field-row{ display:flex; gap:8px; margin-bottom:8px; }
  .field{ flex:1; display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:10.5px; color:var(--ink-500); font-weight:600; }
  .field input[type="number"], .field input[type="text"], .field select, .field textarea{
    background:var(--navy-800); border:1px solid var(--navy-600); border-radius:6px;
    color:var(--ink-100); padding:7px 8px; font-family:var(--font-body); font-size:12.5px;
    width:100%; outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--gold-500); }
  .field input[type="color"]{
    width:100%; height:32px; background:var(--navy-800); border:1px solid var(--navy-600);
    border-radius:6px; padding:2px; cursor:pointer;
  }
  .field input[type="range"]{ width:100%; accent-color:var(--gold-500); }
  .range-readout{ font-family:var(--font-mono); font-size:10.5px; color:var(--ink-500); }
  textarea{ resize:vertical; min-height:56px; }
  #no-selection{
    padding:40px 20px; text-align:center; color:var(--ink-700); font-size:12.5px; line-height:1.7;
  }
  #no-selection strong{ display:block; color:var(--ink-500); font-family:var(--font-display); font-size:13px; margin-bottom:6px; }

  button.mini{
    background:var(--navy-800); border:1px solid var(--navy-600); color:var(--ink-100);
    font-size:11.5px; font-weight:600; padding:6px 10px; border-radius:6px; cursor:pointer;
  }
  button.mini:hover{ border-color:var(--gold-500); }
  .btn-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .swatches{ display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .swatch{
    width:20px; height:20px; border-radius:5px; cursor:pointer; border:1px solid rgba(255,255,255,0.15);
  }

  /* ---------- Filter dialog / uploads ---------- */
  #hidden-file-input{ display:none; }

  /* ---------- Toast ---------- */
  #toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--navy-800); border:1px solid var(--gold-500); color:var(--ink-100);
    padding:10px 18px; border-radius:8px; font-size:12.5px; font-weight:500;
    opacity:0; pointer-events:none; transition:all .25s ease; z-index:100;
    display:flex; align-items:center; gap:8px;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #toast .dot{ width:6px; height:6px; border-radius:50%; background:var(--gold-500); }

  /* scrollbars */
  ::-webkit-scrollbar{ width:8px; height:8px; }
  ::-webkit-scrollbar-track{ background:transparent; }
  ::-webkit-scrollbar-thumb{ background:var(--navy-600); border-radius:8px; }
  ::-webkit-scrollbar-thumb:hover{ background:var(--navy-500); }

  footer.credit{
    grid-column:1 / -1;
  }
  #footer-credit{
    position:fixed; bottom:8px; right:14px; font-family:var(--font-mono); font-size:10px;
    color:var(--ink-700); letter-spacing:0.3px; z-index:5; pointer-events:none;
  }

  @media (max-width: 900px){
    #app{ grid-template-columns: 1fr; grid-template-rows: 56px 1fr; grid-template-areas:"header" "stage"; }
    #layers-panel, #inspector{ display:none; }
  }
</style>
</head>
<body>

<div id="app">

  <header>
    <div class="brand">
      <div class="brand-mark">CC</div>
      <div class="brand-title">Creative Canvas <span>Desk</span></div>
    </div>
    <div class="toolbar">
      <button class="tool-btn" id="btn-add-text" title="Add text">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg>
        Text
      </button>
      <button class="tool-btn" id="btn-add-rect" title="Add rectangle">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
        Rect
      </button>
      <button class="tool-btn" id="btn-add-circle" title="Add circle">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>
        Circle
      </button>
      <button class="tool-btn" id="btn-add-line" title="Add line">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20 20 4"/></svg>
        Line
      </button>
      <button class="tool-btn" id="btn-add-image" title="Add image">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
        Image
      </button>
      <button class="tool-btn" id="btn-import-psd" title="Import PSD file">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6"/></svg>
        Import PSD
      </button>
      <div class="tool-sep"></div>
      <button class="tool-btn" id="btn-load" title="Load design JSON">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        Load
      </button>
      <button class="tool-btn" id="btn-save" title="Save design JSON">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
        Save
      </button>
      <button class="tool-btn primary" id="btn-export" title="Export PNG">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/></svg>
        Export PNG
      </button>
    </div>
  </header>

  <div id="layers-panel">
    <div class="panel-heading">Layers <small id="layer-count">0</small></div>
    <div id="layer-list"></div>
    <div id="empty-layers">No layers yet.<br>Add text, a shape, or an image to get started.</div>
  </div>

  <div id="stage-wrap">
    <div id="stage-toolbar">
      <button class="tool-btn" id="btn-zoom-out">−</button>
      <span id="zoom-readout">100%</span>
      <button class="tool-btn" id="btn-zoom-in">+</button>
      <div class="tool-sep"></div>
      <button class="tool-btn" id="btn-zoom-fit">Fit</button>
    </div>
    <div id="canvas-shell">
      <div id="artboard-guide"></div>
      <canvas id="fabric-canvas"></canvas>
    </div>
    <div id="canvas-dims">1080 × 1080 px</div>
  </div>

  <div id="inspector">
    <div id="no-selection">
      <strong>No layer selected</strong>
      Click a layer on the canvas or in the layers list to edit its properties here.
    </div>
    <div id="insp-content" style="display:none;"></div>

    <div class="insp-section" id="canvas-size-section">
      <h4>Canvas Size</h4>
      <div class="field-row">
        <div class="field">
          <label>Width (px)</label>
          <input type="number" id="canvas-w" value="1080" min="50" max="4000">
        </div>
        <div class="field">
          <label>Height (px)</label>
          <input type="number" id="canvas-h" value="1080" min="50" max="4000">
        </div>
      </div>
      <div class="field-row" style="margin-top:2px; margin-bottom:8px;">
        <label style="display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-300);">
          <input type="checkbox" id="scale-layers-toggle" style="width:auto;"> Scale layers with new size
        </label>
      </div>
      <button class="mini" id="btn-resize-canvas" style="width:100%;">Apply Size</button>
    </div>
  </div>

</div>

<input type="file" id="hidden-file-input" accept="image/*">
<input type="file" id="hidden-json-input" accept="application/json">
<input type="file" id="hidden-psd-input" accept=".psd,.psb">
<div id="toast"><span class="dot"></span><span id="toast-text"></span></div>
<div id="footer-credit">Developed by Saurabh Yadav</div>

<script>
/* =========================================================
   Creative Canvas Desk
   Single-file layered editor for ad creatives (Fabric.js)
   ========================================================= */

const GOLD = '#d9a94a';
let layerCounter = 0;

// The fabric canvas is a large fixed "workspace" — layers can live
// anywhere on it. The "artboard" is just a rectangle within that
// workspace marking the actual export bounds; resizing it never
// clips or hides anything, since the underlying canvas doesn't shrink.
let WORKSPACE = 4000;
const ARTBOARD_OFFSET = 1200;
let artboard = { left: ARTBOARD_OFFSET, top: ARTBOARD_OFFSET, width: 1080, height: 1080 };

const canvas = new fabric.Canvas('fabric-canvas', {
  width: WORKSPACE,
  height: WORKSPACE,
  backgroundColor: 'rgba(0,0,0,0)',
  preserveObjectStacking: true,
});

document.getElementById('canvas-shell').style.width = WORKSPACE + 'px';
document.getElementById('canvas-shell').style.height = WORKSPACE + 'px';

// Grows the fixed workspace canvas (and re-centers the artboard offset)
// whenever an artboard needs more room than the current workspace has.
// Without this, an artboard larger than WORKSPACE - ARTBOARD_OFFSET gets
// positioned partly or fully outside the <canvas> element's own pixel
// bounds, and anything outside those bounds simply never renders —
// layers still show up correctly in the sidebar (that's just PSD
// metadata) but the stage looks completely blank.
function ensureWorkspaceFits(w, h){
  const needed = Math.max(w, h) + ARTBOARD_OFFSET * 2;
  if (needed <= WORKSPACE) return;
  WORKSPACE = needed;
  canvas.setWidth(WORKSPACE);
  canvas.setHeight(WORKSPACE);
  document.getElementById('canvas-shell').style.width = WORKSPACE + 'px';
  document.getElementById('canvas-shell').style.height = WORKSPACE + 'px';
  canvas.requestRenderAll();
}

function updateArtboardGuide(){
  const g = document.getElementById('artboard-guide');
  g.style.left = artboard.left + 'px';
  g.style.top = artboard.top + 'px';
  g.style.width = artboard.width + 'px';
  g.style.height = artboard.height + 'px';
  document.getElementById('canvas-dims').textContent = `${artboard.width} × ${artboard.height} px`;
  document.getElementById('canvas-w').value = artboard.width;
  document.getElementById('canvas-h').value = artboard.height;
}
updateArtboardGuide();

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg){
  const el = document.getElementById('toast');
  document.getElementById('toast-text').textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> el.classList.remove('show'), 2200);
}

/* ---------- Zoom ---------- */
let zoom = 1;
function applyZoom(z){
  zoom = Math.min(3, Math.max(0.05, z));
  const shell = document.getElementById('canvas-shell');
  shell.style.transform = `scale(${zoom})`;
  shell.style.transformOrigin = '0 0';
  document.getElementById('zoom-readout').textContent = Math.round(zoom*100) + '%';
}
function centerOnArtboard(){
  const wrap = document.getElementById('stage-wrap');
  wrap.scrollLeft = (artboard.left + artboard.width/2) * zoom - wrap.clientWidth/2;
  wrap.scrollTop = (artboard.top + artboard.height/2) * zoom - wrap.clientHeight/2;
}
document.getElementById('btn-zoom-in').onclick = ()=>{ applyZoom(zoom + 0.1); };
document.getElementById('btn-zoom-out').onclick = ()=>{ applyZoom(zoom - 0.1); };
document.getElementById('btn-zoom-fit').onclick = ()=>{
  const wrap = document.getElementById('stage-wrap');
  const availW = wrap.clientWidth - 80;
  const availH = wrap.clientHeight - 80;
  const fit = Math.min(availW / artboard.width, availH / artboard.height, 1.5);
  applyZoom(fit);
  centerOnArtboard();
};

/* ---------- Layer naming / icons ---------- */
function labelFor(obj){
  if (obj._customName) return obj._customName;
  if (obj.type === 'i-text' || obj.type === 'text') return (obj.text || 'Text').slice(0, 18);
  if (obj.type === 'rect') return 'Rectangle';
  if (obj.type === 'circle') return 'Circle';
  if (obj.type === 'line') return 'Line';
  if (obj.type === 'image') return 'Image';
  return 'Layer';
}
function iconFor(obj){
  if (obj.type === 'i-text' || obj.type === 'text') return '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h10M4 18h7"/></svg>';
  if (obj.type === 'rect') return '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>';
  if (obj.type === 'circle') return '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg>';
  if (obj.type === 'line') return '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20 20 4"/></svg>';
  if (obj.type === 'image') return '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>';
  return '';
}

/* ---------- Layer list rendering ---------- */
function refreshLayerList(){
  const list = document.getElementById('layer-list');
  const objs = canvas.getObjects().slice().reverse(); // top layer first
  document.getElementById('layer-count').textContent = objs.length;
  document.getElementById('empty-layers').style.display = objs.length ? 'none' : 'block';
  list.innerHTML = '';
  const active = canvas.getActiveObject();

  objs.forEach((obj)=>{
    const row = document.createElement('div');
    row.className = 'layer-row' + (obj === active ? ' active' : '');
    row.draggable = true;
    row.dataset.id = obj._layerId;

    row.innerHTML = `
      <div class="layer-icon">${iconFor(obj)}</div>
      <div class="layer-name">${labelFor(obj)}</div>
      <div class="layer-actions">
        <button class="btn-vis" title="Toggle visibility">${obj.visible === false ? eyeOffSvg() : eyeSvg()}</button>
        <button class="btn-lock" title="Toggle lock">${obj.lockMovementX ? lockSvg() : unlockSvg()}</button>
        <button class="btn-del" title="Delete">${trashSvg()}</button>
      </div>
    `;

    row.querySelector('.layer-name').onclick = row.onclick = (e)=>{
      if (e.target.closest('.layer-actions')) return;
      canvas.setActiveObject(obj);
      canvas.requestRenderAll();
      refreshLayerList();
      renderInspector();
    };
    row.querySelector('.btn-vis').onclick = (e)=>{
      e.stopPropagation();
      obj.visible = obj.visible === false ? true : false;
      canvas.requestRenderAll();
      refreshLayerList();
    };
    row.querySelector('.btn-lock').onclick = (e)=>{
      e.stopPropagation();
      const locked = !obj.lockMovementX;
      obj.lockMovementX = obj.lockMovementY = obj.lockScalingX = obj.lockScalingY = obj.lockRotation = locked;
      obj.selectable = !locked;
      canvas.requestRenderAll();
      refreshLayerList();
    };
    row.querySelector('.btn-del').onclick = (e)=>{
      e.stopPropagation();
      canvas.remove(obj);
      canvas.requestRenderAll();
      refreshLayerList();
      renderInspector();
    };

    // drag to reorder
    row.addEventListener('dragstart', ()=> row.classList.add('dragging'));
    row.addEventListener('dragend', ()=>{
      row.classList.remove('dragging');
      reorderFromDOM();
    });
    row.addEventListener('dragover', (e)=>{
      e.preventDefault();
      const dragging = list.querySelector('.dragging');
      if (!dragging || dragging === row) return;
      const rect = row.getBoundingClientRect();
      const after = (e.clientY - rect.top) > rect.height / 2;
      row.parentNode.insertBefore(dragging, after ? row.nextSibling : row);
    });

    list.appendChild(row);
  });
}

function reorderFromDOM(){
  const ids = Array.from(document.querySelectorAll('.layer-row')).map(r => r.dataset.id).reverse();
  ids.forEach((id, index)=>{
    const obj = canvas.getObjects().find(o => o._layerId === id);
    if (obj) canvas.moveTo(obj, index);
  });
  canvas.requestRenderAll();
  refreshLayerList();
}

/* ---------- PSD import ---------- */
document.getElementById('btn-import-psd').onclick = ()=> document.getElementById('hidden-psd-input').click();

document.getElementById('hidden-psd-input').onchange = async (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;

  toast('Reading PSD…');

  if (typeof agPsd === 'undefined'){
    toast('PSD library failed to load — check your connection and retry');
    return;
  }

  try{
    const buffer = await file.arrayBuffer();
    const psd = agPsd.readPsd(buffer, { skipCompositeImageData: true, skipLayerImageData: false, skipThumbnail: true });

    // Resize the artboard (not the workspace) to match the PSD document
    ensureWorkspaceFits(psd.width, psd.height);
    artboard.width = psd.width;
    artboard.height = psd.height;
    updateArtboardGuide();

    // Walk the layer tree, collecting visible leaf (rendered) layers in
    // top-to-bottom document order. Groups themselves aren't imported —
    // only their visible children carry pixel data.
    const flat = [];
    function walk(layers, parentVisible){
      if (!layers) return;
      layers.forEach(layer=>{
        const visible = parentVisible && layer.visible !== false;
        if (layer.children){
          walk(layer.children, visible);
        } else if (visible && layer.canvas){
          flat.push(layer);
        }
      });
    }
    walk(psd.children, true);

    if (!flat.length){
      toast('No visible raster layers found in this PSD');
      return;
    }

    // ag-psd lists layers bottom-to-top per group already; add in that
    // order so the last-added (topmost) layer ends up on top in Fabric.
    // Positions are offset by the artboard's origin on the workspace,
    // so layers extending beyond the PSD's own frame stay fully
    // visible and editable rather than being clipped.
    let imported = 0;
    let skipped = 0;
    for (const layer of flat){
      if (!layer.canvas.width || !layer.canvas.height){
        console.warn('Skipped PSD layer with empty canvas:', layer.name);
        skipped++;
        continue;
      }
      let dataUrl;
      try{
        dataUrl = layer.canvas.toDataURL();
      }catch(layerErr){
        console.warn('Skipped PSD layer that failed to decode:', layer.name, layerErr);
        skipped++;
        continue;
      }

      // fabric.Image.fromURL only calls back on success — if the browser
      // ever fails to decode a layer's image data, that callback never
      // fires and an `await` on it would hang forever, silently freezing
      // the rest of the import. Loading the image ourselves with
      // onload/onerror/a timeout guarantees we always move on.
      const ok = await new Promise((resolve)=>{
        const htmlImg = new Image();
        let settled = false;
        const finish = (success)=>{
          if (settled) return;
          settled = true;
          resolve(success);
        };
        htmlImg.onload = ()=>{
          const img = new fabric.Image(htmlImg);
          // ag-psd reports layer.opacity as a 0-1 fraction already.
          // Defensively handle a 0-255 scale too (a common mistake when
          // porting Photoshop-style byte values), so a fully-opaque
          // layer never ends up rendering as near-invisible.
          let op = typeof layer.opacity === 'number' ? layer.opacity : 1;
          if (op > 1) op = op / 255;
          op = Math.max(0, Math.min(1, op));
          img.set({ left: artboard.left + layer.left, top: artboard.top + layer.top, opacity: op });
          img._customName = layer.name || 'Layer';
          addAndSelect(img);
          imported++;
          finish(true);
        };
        htmlImg.onerror = (err)=>{
          console.warn('Skipped PSD layer image that failed to load:', layer.name, err);
          finish(false);
        };
        setTimeout(()=>{
          if (!settled) console.warn('Skipped PSD layer image that timed out loading:', layer.name);
          finish(false);
        }, 8000);
        htmlImg.src = dataUrl;
      });
      if (!ok) skipped++;
    }

    canvas.discardActiveObject();
    canvas.requestRenderAll();
    refreshLayerList();
    document.getElementById('btn-zoom-fit').click();
    if (skipped){
      toast(`Imported ${imported} layer${imported === 1 ? '' : 's'}, skipped ${skipped} (empty/unsupported)`);
    } else {
      toast(`Imported ${imported} layer${imported === 1 ? '' : 's'} from PSD`);
    }
  }catch(err){
    console.error(err);
    toast('PSD parse error: ' + (err && err.message ? err.message : 'unknown error'));
  }
};

/* ---------- Artboard resize ---------- */
document.getElementById('btn-resize-canvas').onclick = ()=>{
  const w = parseInt(document.getElementById('canvas-w').value, 10) || 1080;
  const h = parseInt(document.getElementById('canvas-h').value, 10) || 1080;
  const scaleLayers = document.getElementById('scale-layers-toggle').checked;

  if (scaleLayers){
    const sx = w / artboard.width;
    const sy = h / artboard.height;
    canvas.getObjects().forEach(obj=>{
      const relLeft = obj.left - artboard.left;
      const relTop = obj.top - artboard.top;
      obj.set({
        left: artboard.left + relLeft * sx,
        top: artboard.top + relTop * sy,
        scaleX: (obj.scaleX || 1) * sx,
        scaleY: (obj.scaleY || 1) * sy,
      });
      obj.setCoords();
    });
  }

  ensureWorkspaceFits(w, h);
  artboard.width = w;
  artboard.height = h;
  updateArtboardGuide();
  canvas.requestRenderAll();
  refreshLayerList();
  document.getElementById('btn-zoom-fit').click();
  toast(scaleLayers ? 'Artboard resized — layers scaled to fit' : 'Artboard resized — layers unchanged');
};

/* ---------- Inspector ---------- */
function renderInspector(){
  const obj = canvas.getActiveObject();
  const content = document.getElementById('insp-content');
  const empty = document.getElementById('no-selection');

  if (!obj){
    content.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  content.style.display = 'block';

  let html = `
    <div class="insp-section">
      <h4>Transform</h4>
      <div class="field-row">
        <div class="field"><label>X</label><input type="number" id="p-left" value="${Math.round(obj.left)}"></div>
        <div class="field"><label>Y</label><input type="number" id="p-top" value="${Math.round(obj.top)}"></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Rotation</label><input type="number" id="p-angle" value="${Math.round(obj.angle||0)}"></div>
        <div class="field"><label>Opacity</label><input type="range" id="p-opacity" min="0" max="1" step="0.01" value="${obj.opacity ?? 1}"></div>
      </div>
    </div>
  `;

  if (obj.type === 'i-text' || obj.type === 'text'){
    html += `
      <div class="insp-section">
        <h4>Text</h4>
        <div class="field"><label>Content</label><textarea id="p-text">${obj.text || ''}</textarea></div>
        <div class="field-row">
          <div class="field"><label>Font size</label><input type="number" id="p-fontsize" value="${obj.fontSize || 32}"></div>
          <div class="field"><label>Weight</label>
            <select id="p-weight">
              <option value="400" ${obj.fontWeight=='400'?'selected':''}>Regular</option>
              <option value="500" ${obj.fontWeight=='500'?'selected':''}>Medium</option>
              <option value="600" ${obj.fontWeight=='600'?'selected':''}>Semibold</option>
              <option value="700" ${obj.fontWeight=='700'?'selected':''}>Bold</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Align</label>
            <select id="p-align">
              <option value="left" ${obj.textAlign=='left'?'selected':''}>Left</option>
              <option value="center" ${obj.textAlign=='center'?'selected':''}>Center</option>
              <option value="right" ${obj.textAlign=='right'?'selected':''}>Right</option>
            </select>
          </div>
          <div class="field"><label>Color</label><input type="color" id="p-fill" value="${toHex(obj.fill)}"></div>
        </div>
      </div>
    `;
  } else if (obj.type === 'rect' || obj.type === 'circle'){
    html += `
      <div class="insp-section">
        <h4>Fill &amp; Stroke</h4>
        <div class="field-row">
          <div class="field"><label>Fill</label><input type="color" id="p-fill" value="${toHex(obj.fill)}"></div>
          <div class="field"><label>Stroke</label><input type="color" id="p-stroke" value="${toHex(obj.stroke || '#000000')}"></div>
        </div>
        <div class="field"><label>Stroke width</label><input type="number" id="p-strokewidth" value="${obj.strokeWidth || 0}" min="0" max="40"></div>
      </div>
    `;
  } else if (obj.type === 'line'){
    html += `
      <div class="insp-section">
        <h4>Stroke</h4>
        <div class="field-row">
          <div class="field"><label>Color</label><input type="color" id="p-stroke" value="${toHex(obj.stroke || '#000000')}"></div>
          <div class="field"><label>Width</label><input type="number" id="p-strokewidth" value="${obj.strokeWidth || 2}" min="1" max="40"></div>
        </div>
      </div>
    `;
  } else if (obj.type === 'image'){
    const f = obj._filterState || {brightness:0, contrast:0, saturation:0, blur:0, shadow:false};
    html += `
      <div class="insp-section">
        <h4>Filters</h4>
        <div class="field">
          <label>Brightness <span class="range-readout" id="rv-brightness">${f.brightness}</span></label>
          <input type="range" id="p-brightness" min="-1" max="1" step="0.01" value="${f.brightness}">
        </div>
        <div class="field">
          <label>Contrast <span class="range-readout" id="rv-contrast">${f.contrast}</span></label>
          <input type="range" id="p-contrast" min="-1" max="1" step="0.01" value="${f.contrast}">
        </div>
        <div class="field">
          <label>Saturation <span class="range-readout" id="rv-saturation">${f.saturation}</span></label>
          <input type="range" id="p-saturation" min="-1" max="1" step="0.01" value="${f.saturation}">
        </div>
        <div class="field">
          <label>Blur <span class="range-readout" id="rv-blur">${f.blur}</span></label>
          <input type="range" id="p-blur" min="0" max="1" step="0.01" value="${f.blur}">
        </div>
        <div class="field-row" style="margin-top:4px;">
          <label style="display:flex; align-items:center; gap:8px; font-size:12px; color:var(--ink-300);">
            <input type="checkbox" id="p-shadow" ${f.shadow ? 'checked' : ''} style="width:auto;"> Drop shadow
          </label>
        </div>
      </div>
    `;
  }

  html += `
    <div class="insp-section">
      <h4>Layer</h4>
      <div class="field"><label>Name</label><input type="text" id="p-name" value="${labelFor(obj)}"></div>
      <div class="btn-row" style="margin-top:8px;">
        <button class="mini" id="p-duplicate">Duplicate</button>
        <button class="mini" id="p-front">Bring to front</button>
        <button class="mini" id="p-back">Send to back</button>
        <button class="mini" id="p-delete" style="color:var(--danger); border-color:var(--danger);">Delete</button>
      </div>
    </div>
  `;

  content.innerHTML = html;
  bindInspectorEvents(obj);
}

function toHex(c){
  if (!c) return '#000000';
  if (c.startsWith('#')) return c.length === 7 ? c : '#000000';
  const m = c.match(/rgba?\((\d+),\s*(\d+),\s*(\d+)/);
  if (!m) return '#000000';
  return '#' + [1,2,3].map(i => parseInt(m[i]).toString(16).padStart(2,'0')).join('');
}

function bindInspectorEvents(obj){
  const $ = (id)=> document.getElementById(id);
  const rerender = ()=>{ canvas.requestRenderAll(); refreshLayerList(); };

  if ($('p-left')) $('p-left').oninput = (e)=>{ obj.set('left', parseFloat(e.target.value)||0); rerender(); };
  if ($('p-top')) $('p-top').oninput = (e)=>{ obj.set('top', parseFloat(e.target.value)||0); rerender(); };
  if ($('p-angle')) $('p-angle').oninput = (e)=>{ obj.set('angle', parseFloat(e.target.value)||0); rerender(); };
  if ($('p-opacity')) $('p-opacity').oninput = (e)=>{ obj.set('opacity', parseFloat(e.target.value)); rerender(); };

  if ($('p-text')) $('p-text').oninput = (e)=>{ obj.set('text', e.target.value); rerender(); };
  if ($('p-fontsize')) $('p-fontsize').oninput = (e)=>{ obj.set('fontSize', parseFloat(e.target.value)||32); rerender(); };
  if ($('p-weight')) $('p-weight').onchange = (e)=>{ obj.set('fontWeight', e.target.value); rerender(); };
  if ($('p-align')) $('p-align').onchange = (e)=>{ obj.set('textAlign', e.target.value); rerender(); };
  if ($('p-fill')) $('p-fill').oninput = (e)=>{ obj.set('fill', e.target.value); rerender(); };
  if ($('p-stroke')) $('p-stroke').oninput = (e)=>{ obj.set('stroke', e.target.value); rerender(); };
  if ($('p-strokewidth')) $('p-strokewidth').oninput = (e)=>{ obj.set('strokeWidth', parseFloat(e.target.value)||0); rerender(); };

  if (obj.type === 'image'){
    const applyFilters = ()=>{
      const state = obj._filterState = obj._filterState || {};
      state.brightness = parseFloat($('p-brightness').value);
      state.contrast = parseFloat($('p-contrast').value);
      state.saturation = parseFloat($('p-saturation').value);
      state.blur = parseFloat($('p-blur').value);
      state.shadow = $('p-shadow').checked;

      $('rv-brightness').textContent = state.brightness.toFixed(2);
      $('rv-contrast').textContent = state.contrast.toFixed(2);
      $('rv-saturation').textContent = state.saturation.toFixed(2);
      $('rv-blur').textContent = state.blur.toFixed(2);

      obj.filters = [
        new fabric.Image.filters.Brightness({ brightness: state.brightness }),
        new fabric.Image.filters.Contrast({ contrast: state.contrast }),
        new fabric.Image.filters.Saturation({ saturation: state.saturation }),
        new fabric.Image.filters.Blur({ blur: state.blur }),
      ];
      obj.applyFilters();

      if (state.shadow){
        obj.set('shadow', new fabric.Shadow({ color: 'rgba(0,0,0,0.45)', blur: 18, offsetX: 6, offsetY: 8 }));
      } else {
        obj.set('shadow', null);
      }
      canvas.requestRenderAll();
    };
    ['p-brightness','p-contrast','p-saturation','p-blur'].forEach(id => $(id).oninput = applyFilters);
    $('p-shadow').onchange = applyFilters;
  }

  if ($('p-name')) $('p-name').oninput = (e)=>{ obj._customName = e.target.value; refreshLayerList(); };
  if ($('p-duplicate')) $('p-duplicate').onclick = ()=>{
    obj.clone((clone)=>{
      clone.set({ left: obj.left + 20, top: obj.top + 20 });
      addAndSelect(clone);
    });
  };
  if ($('p-front')) $('p-front').onclick = ()=>{ canvas.bringToFront(obj); rerender(); };
  if ($('p-back')) $('p-back').onclick = ()=>{ canvas.sendToBack(obj); rerender(); };
  if ($('p-delete')) $('p-delete').onclick = ()=>{
    canvas.remove(obj);
    rerender();
    renderInspector();
  };
}

/* ---------- Save / Load design JSON ----------
   Configure APPS_SCRIPT_URL below to persist through your backend,
   same pattern as your other Ad Ops tools. Until then, save/load
   falls back to a downloadable/uploadable .json file. */
const APPS_SCRIPT_URL = ''; // e.g. 'https://script.google.com/macros/s/XXXX/exec'

async function saveDesign(){
  const payload = {
    width: artboard.width,
    height: artboard.height,
    artboard: { ...artboard },
    savedAt: new Date().toISOString(),
    fabric: canvas.toJSON(['_layerId','_customName','_filterState']),
  };

  if (APPS_SCRIPT_URL){
    try{
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'save', payload }),
      });
      toast('Design saved to backend');
      return;
    }catch(err){
      toast('Backend save failed — downloading JSON instead');
    }
  }
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `design-${Date.now()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Design downloaded as JSON');
}

function loadDesignFromPayload(payload){
  // Files saved before the artboard/workspace model existed stored
  // objects positioned from (0,0) directly — fall back to an
  // unoffset artboard for those so old positions still line up.
  if (payload.artboard){
    artboard = { ...payload.artboard };
  } else {
    artboard = { left: 0, top: 0, width: payload.width || 1080, height: payload.height || 1080 };
  }
  ensureWorkspaceFits(artboard.left + artboard.width, artboard.top + artboard.height);
  updateArtboardGuide();

  canvas.loadFromJSON(payload.fabric, ()=>{
    canvas.getObjects().forEach(o => { if (!o._layerId) assignId(o); });
    canvas.requestRenderAll();
    refreshLayerList();
    renderInspector();
    document.getElementById('btn-zoom-fit').click();
    toast('Design loaded');
  });
}

document.getElementById('btn-save').onclick = saveDesign;
document.getElementById('btn-load').onclick = ()=> document.getElementById('hidden-json-input').click();
document.getElementById('hidden-json-input').onchange = (e)=>{
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    try{
      const payload = JSON.parse(ev.target.result);
      loadDesignFromPayload(payload);
    }catch(err){
      toast('Could not read that file');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
};

/* ---------- Keyboard shortcuts ---------- */
document.addEventListener('keydown', (e)=>{
  const tag = document.activeElement.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA') return;
  const obj = canvas.getActiveObject();
  if ((e.key === 'Delete' || e.key === 'Backspace') && obj){
    canvas.remove(obj);
    canvas.requestRenderAll();
    refreshLayerList();
    renderInspector();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'd' && obj){
    e.preventDefault();
    obj.clone((clone)=>{
      clone.set({ left: obj.left + 20, top: obj.top + 20 });
      addAndSelect(clone);
    });
  }
});

/* ---------- Init ---------- */
window.addEventListener('resize', ()=> document.getElementById('btn-zoom-fit').click());
window.addEventListener('load', ()=> document.getElementById('btn-zoom-fit').click());
refreshLayerList();
renderInspector();
document.getElementById('btn-zoom-fit').click();
</script>
</body>
</html>
